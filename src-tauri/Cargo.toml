[package]
name = "slime"
version = "0.0.1"
description = "A desk slime that eats windows"
authors = ["you"]
edition = "2021"

[lib]
name = "slime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# Only ever used to check that a save parses. The shape of the save lives in TypeScript.
serde_json = "1"
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread"] }

# Pinned to the version tauri already pulls in, so this adds features rather than a second copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
