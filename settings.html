<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slime settings</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <main>
      <h1>Slime</h1>

      <section id="rebirth-box" hidden>
        <h2 id="rebirth-title"></h2>
        <p id="rebirth-state" class="muted"></p>
        <div class="row">
          <button id="rebirth" class="secondary"></button>
        </div>
        <p id="rebirth-warn" class="muted"></p>
      </section>

      <section id="arena-box">
        <h2 id="arena-title"></h2>

        <div id="arena-schools" class="chips"></div>
        <div id="arena-picked" class="picked"></div>
        <p id="arena-combos" class="muted combos"></p>

        <div class="row">
          <button id="arena-start"></button>
          <button id="arena-stop" class="secondary"></button>
        </div>
      </section>

      <section id="language-box">
        <h2 id="language-title"></h2>
        <div id="language-chips" class="chips"></div>
        <p id="language-auto" class="muted"></p>
      </section>

      <section>
        <h2 id="quiet-title"></h2>
        <label class="check">
          <input id="quiet" type="checkbox" />
          <span id="quiet-label"></span>
        </label>
        <p id="quiet-note" class="muted"></p>
      </section>

      <section>
        <h2 id="lielow-title"></h2>
        <label class="check">
          <input id="lielow" type="checkbox" />
          <span id="lielow-label"></span>
        </label>
        <p id="lielow-note" class="muted"></p>
      </section>

      <section>
        <h2 id="feats-title"></h2>
        <p id="feats-count" class="muted"></p>
        <div id="feats-list" class="feats"></div>
      </section>

      <footer>
        <button id="quit" class="link danger">Quit Slime</button>
        <code class="hotkey">Ctrl+Alt+Shift+Q</code>
      </footer>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
